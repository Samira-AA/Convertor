# Perfil local. No carga el .env de Supabase.
spring.config.import=optional:file:.env.local[.properties]
spring.datasource.url=${PDFA_DB_URL:jdbc:postgresql://localhost:5432/db_sumax_pdfa}
spring.datasource.username=${PDFA_DB_USERNAME:pdfa_app}
spring.datasource.password=${PDFA_DB_PASSWORD}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
