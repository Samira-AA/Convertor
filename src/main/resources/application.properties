spring.application.name=sumax-pdfa-api
# Activar solo una de las siguientes opciones y reiniciar la aplicacion.
spring.profiles.default=supabase
server.port=8081
server.servlet.context-path=/sumax-convert-pdfa

# Tamano maximo (20 MB).
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=0

# Concurrencia HTTP: conversion sincrona en hasta 4 hilos.
server.tomcat.threads.max=4

# Limites del conversor (paginas y timeout).
pdfa.max-pages=${PDFA_MAX_PAGES}
pdfa.timeout-seconds=300

# Autenticacion exclusiva mediante claves; sin usuarios automaticos.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
management.endpoints.web.exposure.include=health

# Configuracion compartida de persistencia; la conexion se define por perfil.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false

# Administracion deshabilitada si no se configura una clave independiente.
pdfa.security.admin-key=${PDFA_ADMIN_KEY}
