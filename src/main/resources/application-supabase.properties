# Perfil Supabase. Variables inyectadas desde el entorno de ejecucion.
spring.datasource.url=${PDFA_DB_URL_SUPABASE}
spring.datasource.username=${PDFA_DB_USERNAME_SUPABASE}
spring.datasource.password=${PDFA_DB_PASSWORD_SUPABASE}

# Limitar conexiones para compartir el pool de Supabase con otros clientes.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Esquema existente en Supabase; sin migraciones ni cambios automaticos.
spring.jpa.hibernate.ddl-auto=none
